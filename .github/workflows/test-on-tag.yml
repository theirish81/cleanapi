name: Test and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

  release:
    name: Build and Release Binaries
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build Binaries
        run: |
          mkdir -p dist
          # Build matrix: OS/Arch
          PLATFORMS=("linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64")

          for platform in "${PLATFORMS[@]}"; do
            OS="${platform%/*}"
            ARCH="${platform#*/}"

            BINARY_NAME="cleanapi-${OS}-${ARCH}"
            if [ "$OS" == "windows" ]; then
              BINARY_NAME="cleanapi.exe"
            fi

            echo "Building for $OS/$ARCH..."
            GOOS=$OS GOARCH=$ARCH go build -o "dist/$BINARY_NAME" main.go
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

